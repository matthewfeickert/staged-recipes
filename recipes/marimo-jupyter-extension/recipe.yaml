schema_version: 1

context:
  version: "0.4.0"

package:
  name: marimo-jupyter-extension
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/marimo-jupyter-extension/marimo_jupyter_extension-${{ version }}.tar.gz
  sha256: 9828a398a6619c410b62b5f29c7ea7f07b4dda6d8e1ac0759f729200161088da

build:
  number: 0
  noarch: python
  script:
    # conda-forge's uv is the standalone binary without Python dist-info, so
    # pip check would fail on the 'uv' wheel requirement. The extension only
    # shells out to uv/uvx and never imports the uv module, so drop it from the
    # wheel metadata and keep uv as a conda run requirement instead.
    - sed -i '/"uv>=0.4",/d' pyproject.toml
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    # Note: Only needed for uv fix above
    - sed
  host:
    - python ${{ python_min }}.*
    - hatchling
    - jupyterlab >=4.0.0,<5
    - hatch-jupyter-builder
    - pip
  run:
    - python >=${{ python_min }}
    - jupyter-server-proxy
    - traitlets >=5.0
    - uv >=0.4
    - nbconvert >=7.0
    - pyzmq

tests:
  - python:
      imports:
        - marimo_jupyter_extension
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Jupyter extension to proxy marimo with JupyterLab integration
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/marimo-team/marimo-jupyter-extension
  repository: https://github.com/marimo-team/marimo-jupyter-extension
  documentation: https://marimo-team.github.io/marimo-jupyter-extension/

extra:
  recipe-maintainers:
    - dmadisetti
